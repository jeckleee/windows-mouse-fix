[package]
name = "windows-mouse-fix"
version = "0.2.1"
edition = "2024"
description = "A lightweight Windows mouse button remapper with an on-demand settings UI"
license = "MIT"
repository = "https://github.com/jeckleee/windows-mouse-fix"
readme = "README.md"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[profile.release]
lto = "thin"
strip = true
