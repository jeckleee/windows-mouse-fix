name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Build Windows x64
        run: cargo +stable build --locked --release --target x86_64-pc-windows-msvc
      - name: Collect distribution files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/windows-mouse-fix.exe dist/
          Copy-Item LICENSE, README.md, THIRD_PARTY_NOTICES.md, THIRD_PARTY_LICENSES.txt dist/
          New-Item -ItemType Directory -Path dist/assets -Force | Out-Null
          Copy-Item assets/mouse.png dist/assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-mouse-fix-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
